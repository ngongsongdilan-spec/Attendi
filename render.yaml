services:
  - type: web
    name: fet-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://fet-platform.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fet-platform.vercel.app
      - key: COOKIE_SAMESITE
        value: "None"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: fet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fet-cache
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: fet-cache
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: fet-db
    plan: free
    databaseName: fet_platform
    user: fet_app
